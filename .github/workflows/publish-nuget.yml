name: Publish NuGet package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_PATH: MonsterSyncDrive.Library.WebDAV/MonsterSyncDrive.Library.WebDAV.csproj
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Determine release version
        env:
          TZ: Asia/Shanghai
        run: |
          code_version="$(dotnet msbuild "$PROJECT_PATH" -nologo -getProperty:Version)"
          if [[ ! "$code_version" =~ ^([0-9]+)\.([0-9]+)(\.|[-+]|$) ]]; then
            echo "::error::Cannot read the project's major and minor version: $code_version"
            exit 1
          fi
          major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          timestamp="$(date +%Y%m%d%H%M%S)"
          # NuGet normalizes numeric segments, so remove time's leading zeros.
          revision="$((10#${timestamp:8:6}))"
          package_version="$major_minor.${timestamp:0:8}.$revision"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "Release version: $package_version (Asia/Shanghai)"

      - name: Build and pack
        # dotnet pack restores dependencies and builds before creating the package.
        # Keep assembly versions from the project; date-based package segments can exceed their limits.
        run: >-
          dotnet pack "$PROJECT_PATH"
          --configuration Release
          --output "$RUNNER_TEMP/nuget"
          -p:PackageVersion="$PACKAGE_VERSION"
          -p:InformationalVersion="$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryUrl="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          -p:RepositoryType=git
          -p:RepositoryCommit="$GITHUB_SHA"

      - name: Publish to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: >-
          dotnet nuget push "$RUNNER_TEMP/nuget/*.nupkg"
          --source "$NUGET_SOURCE"
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate
