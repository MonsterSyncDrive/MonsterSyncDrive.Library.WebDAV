name: Publish NuGet package

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.created == true && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_PATH: MonsterSyncDrive.Library.WebDAV/MonsterSyncDrive.Library.WebDAV.csproj
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check release version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: python3 .github/scripts/check-release.py

      - name: Set up .NET
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build and pack
        if: steps.release.outputs.should_publish == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        # dotnet pack restores dependencies and builds before creating the package.
        run: >-
          dotnet pack "$PROJECT_PATH"
          --configuration Release
          --output "$RUNNER_TEMP/nuget"
          -p:PackageVersion="$PACKAGE_VERSION"
          -p:InformationalVersion="$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryUrl="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          -p:RepositoryType=git
          -p:RepositoryCommit="$GITHUB_SHA"

      - name: Publish to GitHub Packages
        if: steps.release.outputs.should_publish == 'true'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: >-
          dotnet nuget push "$RUNNER_TEMP/nuget/*.nupkg"
          --source "$NUGET_SOURCE"
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate
